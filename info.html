<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contexto Interactivo - Universidad</title>
  <style>
    /* Tipografía y fondo general */
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      margin: 0; 
      background-color: #F4F4F9; 
      color: #333; 
    }
    
    /* Contenedor inmersivo del video */
    #video-container { 
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
      background: #111; z-index: 999;
    }
    
    video { width: 100%; height: 100%; object-fit: contain; }

    /* Overlay para habilitar el sonido por default */
    #play-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 105, 92, 0.7); 
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; backdrop-filter: blur(5px);
    }
    
    #btn-play {
      background: #00C853; 
      color: #fff; border: none; padding: 18px 36px;
      border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 200, 83, 0.4); transition: transform 0.2s ease;
    }
    #btn-play:active { transform: scale(0.95); }

    /* Botón flotante para omitir */
    #btn-omitir {
      position: absolute; top: 25px; right: 25px; z-index: 1001;
      background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.5);
      padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold;
      cursor: pointer; backdrop-filter: blur(4px); display: none;
    }

    /* Contenedor de la información */
    #info-container { 
      display: none; 
      padding: 0; 
      max-width: 100%; 
      margin: 0 auto; 
      min-height: 100vh; 
      box-sizing: border-box;
      animation: aparecerSuave 0.8s ease forwards;
    }
    
    @keyframes aparecerSuave { 
      from { opacity: 0; transform: translateY(15px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    /* Cabecera institucional superior */
    .institucional-header {
      background-color: #00695C; 
      padding: 15px 20px;
      text-align: center;
      border-bottom: 4px solid #084421; 
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .institucional-header img {
      height: 40px; 
      max-width: 100%;
    }
    
    /* Contenedor central de la tarjeta */
    .contenido-central {
      padding: 30px 24px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Tarjeta estética central */
    .tarjeta {
      background: #FFFFFF; border-radius: 12px; padding: 30px 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .header { margin-bottom: 20px; }
    
    .tag { 
      display: inline-block; background: #00C853; 
      color: #FFFFFF; 
      padding: 6px 14px; border-radius: 20px; font-size: 0.85em; 
      font-weight: 700; margin-bottom: 16px; 
    }
    
    h1 { margin: 0 0 12px 0; font-size: 24px; color: #00695C; }
    .descripcion { line-height: 1.6; color: #555; font-size: 16px; }
    
    .btn-volver { 
      display: block; width: 100%; padding: 16px; margin-top: 30px; 
      background: #00695C; 
      color: #fff; border: none; border-radius: 8px; 
      font-size: 16px; font-weight: bold; cursor: pointer; 
      text-align: center; text-decoration: none; box-sizing: border-box;
      transition: background 0.3s ease;
    }
    .btn-volver:hover { background: #004D40; }
  </style>
</head>
<body>

  <div id="video-container">
    <div id="play-overlay">
      <button id="btn-play">▶ Reproducir Recuerdo</button>
    </div>
    
    <button id="btn-omitir">Omitir ⏭</button>

    <!-- Agregamos el atributo "controls" para habilitar la barra nativa del navegador -->
    <video id="video-player" playsinline controls>
      Tu navegador no soporta reproducción de video.
    </video>
  </div>

  <div id="info-container">
    <div class="institucional-header">
      <img src="logo_tecmilenio.png" alt="Logo Universidad Tecmilenio">
    </div>

    <div class="contenido-central">
      <div class="tarjeta">
        <div class="header">
          <span class="tag" id="ui-ubicacion">📍 Ubicación</span>
          <h1 id="ui-titulo">Cargando...</h1>
        </div>
        <div class="descripcion" id="ui-descripcion"></div>
        
        <a href="index.html" class="btn-volver">Escanear otro recuerdo</a>
      </div>
    </div>
  </div>

  <script>
    const baseDeDatos = {
      "Enactus": {
        titulo: "Campus Chihuahua en Enactus",
        ubicacion: "CDMX",
        videoUrl: "./ENACTUS.mp4", 
        descripcion: "Un vistazo a la experiencia de del equipo Makora en el evento nacional de Enactus."
      },
      "NocheMexa": {
        titulo: "Un poco de la Vivencia en la Universidad",
        ubicacion: "Campus Chihuahua",
        videoUrl: "./MEXA.mp4", 
        descripcion: "¡La noche mexicana en todo su explendor! Te esperamos en la siguiente edición."
      },
      "VEX": {
        titulo: "Equipo de Vex Robotics en Acción",
        ubicacion: "Competencia de Vex Robotics",
        videoUrl: "./VEX.mp4", 
        descripcion: "¡Vex Robotics siempre dandolo todo por dejar en alto a Chihuahua!"
      },
      "FlowRecap": {
        titulo: "La vivencia también está en nuestro equipo",
        ubicacion: "Campus Chihuahua",
        videoUrl: "./FlowRecap.mp4", 
        descripcion: "No siempre se ve lo que ocurre tras bambalinas, pero el equipo de Tecmilenio Chihuahua también se divierte."
      }
    };

    const params = new URLSearchParams(window.location.search);
    const idEscaneado = params.get('id') || "Enactus"; 
    const datosMuestra = baseDeDatos[idEscaneado];

    const videoContainer = document.getElementById('video-container');
    const videoPlayer = document.getElementById('video-player');
    const infoContainer = document.getElementById('info-container');
    const playOverlay = document.getElementById('play-overlay');
    const btnPlay = document.getElementById('btn-play');
    const btnOmitir = document.getElementById('btn-omitir');

    if(datosMuestra) {
        document.getElementById('ui-titulo').innerText = datosMuestra.titulo;
        document.getElementById('ui-ubicacion').innerText = `📍 ${datosMuestra.ubicacion}`;
        document.getElementById('ui-descripcion').innerText = datosMuestra.descripcion;
        videoPlayer.src = datosMuestra.videoUrl;
    }

    // Lógica del botón Reproducir
    btnPlay.addEventListener('click', () => {
      playOverlay.style.display = 'none';
      btnOmitir.style.display = 'block';
      videoPlayer.play();
    });

    // Lógica compartida para ocultar video y mostrar información
    const mostrarInformacion = () => {
      videoPlayer.pause();
      videoContainer.style.display = 'none';
      infoContainer.style.display = 'block';
    };

    videoPlayer.addEventListener('ended', mostrarInformacion);
    btnOmitir.addEventListener('click', mostrarInformacion);
  </script>
</body>
</html>
